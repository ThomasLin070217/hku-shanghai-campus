<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HKU 上海校园 · 实拍素材库</title>
<style>
  :root{color-scheme:light;font:16px/1.6 system-ui,sans-serif;color:#20382e;background:#f2f3ed}
  *{box-sizing:border-box}
  body{margin:0}
  main{max-width:1152px;margin:auto;padding:32px clamp(16px,4vw,48px) 64px}
  header{border-bottom:1px solid #ccd5cb;padding-bottom:24px;margin-bottom:24px}
  h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0 0 12px}
  h2{font-size:24px;margin-top:32px}
  h3{font-size:19px;line-height:1.4;margin:6px 0 10px}
  p{margin:8px 0}
  a{color:#1a5945;text-underline-offset:3px}
  nav{display:flex;gap:8px 24px;flex-wrap:wrap;margin-top:16px}
  label{display:block;font-weight:600;margin-bottom:5px}
  input{font:inherit;width:min(100%,32rem);padding:10px 12px;border:1px solid #85998b;background:#fff;color:inherit;border-radius:6px}
  :focus-visible{outline:2px solid #20644d;outline-offset:3px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
  article{border:1px solid #d5ded4;border-radius:9px;overflow:hidden;background:#fff;max-width:700px}
  .cover{display:block;background:#e5e8df}
  img{width:100%;aspect-ratio:16/10;object-fit:contain;display:block}
  .info{padding:14px 16px 16px}
  .meta,.limits{font-size:14px;color:#4b6157;overflow-wrap:anywhere}
  details,ul{margin-top:8px}
  summary{cursor:pointer;font-weight:600}
  li{margin-bottom:5px}
  @media(max-width:600px){main{padding-top:20px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>HKU 上海校园实拍素材库</h1>
    <p>按点位查原图、原片和关键帧。素材卡标注画面可确认的细节和待核尺寸。</p>
    <nav><a href="CAPTURE.md">下一轮补拍清单</a><a href="manifest.json">机器可读索引</a><a href="../video-followup/index.html">U06–U08 实录</a><a href="../scale-calibration/index.html">已有测距</a><a href="../../interiors.html">室内模型</a></nav>
  </header>
  <div id="search-area" hidden>
    <label for="query">搜索素材</label>
    <input id="query" type="search" placeholder="例如：键盘墙、305、栏杆">
    <p id="results" class="meta" role="status"></p>
  </div>
  <!-- MEDIA_CARDS -->
</main>
<script>
  const query = document.querySelector('#query');
  const cards = [...document.querySelectorAll('article[data-kind]')];
  const sections = [...document.querySelectorAll('section[data-group]')];
  function filter() {
    const terms = query.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    let visible = 0;
    for (const card of cards) {
      const text = card.textContent.toLowerCase();
      card.hidden = !terms.every(term => text.includes(term));
      if (!card.hidden) visible++;
    }
    for (const section of sections) section.hidden = !section.querySelector('article:not([hidden])');
    document.querySelector('#results').textContent = `显示 ${visible} / ${cards.length} 项`;
  }
  document.querySelector('#search-area').hidden = false;
  query.addEventListener('input', filter);
  filter();
</script>
</body>
</html>
