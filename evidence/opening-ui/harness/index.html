<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening UI harness · mock view</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#eef0e9;color:#243a34}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .harness-header{height:68px;display:flex;align-items:center;gap:18px;padding:0 30px;background:#f8f8f3;border-bottom:1px solid #d9dfd4;font-size:12px;letter-spacing:1.4px;color:#6e7d70}
  .harness-brand{font-family:Georgia,serif;font-size:25px;letter-spacing:-2px;color:#243a34}
  .stage{position:relative;height:calc(100dvh - 68px);overflow:hidden;background:linear-gradient(#dfe6d6,#c3cfc0 60%,#a9b8a7)}
  .stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0f2a1f0a 0 1px,transparent 1px 80px),repeating-linear-gradient(0deg,#0f2a1f0a 0 1px,transparent 1px 80px)}
  .stage>canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
  .harness-note{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);margin:0;font-size:12px;color:#3c5a4b;background:#f3f2e5;border:1px solid #92a58e;padding:6px 10px;z-index:1}
</style>
<link rel="stylesheet" href="./bundle.css">
</head>
<body class="exploring">
<header class="harness-header"><span class="harness-brand">HKU</span><span>Opening UI harness · mock OpeningView (no world/robot modules)</span></header>
<main class="stage" aria-label="Campus exploration mock stage">
  <canvas width="1440" height="900" tabindex="0" aria-label="Mock WebGL canvas"></canvas>
  <p class="harness-note">Mock three.js stage · renders only src/opening/ui.ts</p>
</main>
<script type="module" src="./bundle.js"></script>
</body>
</html>
