<!doctype html><meta charset="utf-8"><title>B5 reference correction review</title><style>body{margin:0;background:#222}canvas{display:block}#label{position:fixed;left:20px;top:15px;color:white;font:16px sans-serif;background:#222b;padding:10px}</style><div id="label"></div>
<script>window.addEventListener("error",e=>{document.body.append(String(e.message));window.__ERROR=e.message});window.addEventListener("unhandledrejection",e=>{document.body.append(String(e.reason));window.__ERROR=String(e.reason)});</script><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {createOpeningFleet} from '/src/opening/robots.ts';
import {createNavigation} from '/src/exploration/navigation.ts';
import {BUILDINGS,SITE} from '/src/model/campusParameters.ts';
import {createOpeningNPCs} from '/src/opening/npcs.ts';
import {buildSite} from '/src/model/buildSite.ts';

import {prepareModelTextures} from '/src/model/deferredTextures.ts';
const params=new URLSearchParams(location.search),before=params.has('before'),angle=params.get('angle')||'hall';
const scene=new T.Scene();scene.background=new T.Color('#c7d4d4');
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1100,700);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.append(renderer.domElement);

const world=before?null:createOpeningWorld();const root=before?(await new GLTFLoader().loadAsync('../nov19-corrections/before-opening.glb')).scene:world.root;let previewWorld=world;scene.add(root);if(params.has('full')){scene.remove(root);const full=buildSite(undefined,undefined,true);scene.add(full.root);previewWorld=full.openingWorld;await prepareModelTextures(full.root);}else await prepareModelTextures(root);
const camera=new T.PerspectiveCamera(70,1100/700,.05,180);
const views={posts:[[58,2.2,-43],[58,1.0,-53]],face:[[64,1.5,-63.2],[64,1.46,-61]],crowd:[[62,2.4,-63.5],[75,1.35,-71]],hall:[[62,1.65,-63.1],[78,2,-69]],foyer:[[58,1.65,-57],[64,1.6,-63]],wide:[[78.5,2,-63],[64,2,-73]],stair:[[18,1.65,-49],[-6,1.65,-49]]};const [position,target]=views[angle];camera.position.fromArray(position);camera.lookAt(...target);

if(params.has('incident'))previewWorld?.update({incident:true,laptopAcquired:true,doorOpen:true},0);
const nav=createNavigation(BUILDINGS,SITE,true),fleet=createOpeningFleet(nav);scene.add(fleet.root);fleet.standby(true);const postPositions=fleet.units.map(u=>u.position.toArray());if(params.has('alert'))fleet.update(0,camera.position,true,true);window.__FLEET={count:fleet.count,before:postPositions,after:fleet.units.map(u=>u.position.toArray())};
renderer.render(scene,camera);document.querySelector('#label').textContent=(before?'BEFORE':'AFTER')+' · B5 '+angle+' · estimated dimensions';
window.__REVIEW_READY=true;window.__REVIEW={peopleCount:people.root.children.length,peopleVisible:people.root.visible,meshes:renderer.info.render.calls,triangles:renderer.info.render.triangles};
</script>
