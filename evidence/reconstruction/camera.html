<!doctype html>
<meta charset="utf-8">
<title>Campus reconstruction camera</title>
<style>body { margin: 0; background: #202a30; } canvas { display: block; }</style>
<script type="module">
import * as T from 'three';
import { buildSite } from '/src/model/buildSite.ts';
import { BUILDINGS } from '/src/model/campusParameters.ts';
import { prepareModelTextures } from '/src/model/deferredTextures.ts';

const {root, openingWorld} = buildSite(undefined, undefined, true);
await prepareModelTextures(root);
const scene = new T.Scene();
scene.background = new T.Color(0xbccdd8);
scene.add(root, new T.HemisphereLight(0xfff4e4, 0x757470, 2));
const sun = new T.DirectionalLight(0xffecd5, 2.1);
sun.position.set(35, 90, 60);
scene.add(sun);

const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(960, 600);
renderer.toneMapping = T.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
const camera = new T.PerspectiveCamera(52, 960 / 600, .05, 700);
window.capture = (id, angle) => {
  const b = BUILDINGS.find(b => b.id === id);
  camera.fov = angle === 'player' || id === 'dinner' ? 70 : 52;
  camera.updateProjectionMatrix();
  openingWorld.update({incident: angle.endsWith('incident'), laptopAcquired: false, doorOpen: false}, 0);
  if (id === 'sign') {
    camera.position.set(-7.4, 19.7, -39.4);
    camera.lookAt(-7.4, 19.7, -53);
  } else if (id === 'dinner' && angle.startsWith('head-')) {
    camera.position.set(75.5, 1.65, -65.1);
    camera.lookAt(81, 1.4, -66.6);
  } else if (id === 'forecourt') {
    camera.position.set(52, 2.8, 39);
    camera.lookAt(52, 2.3, 23);
  } else if (id === 'lawn') {
    const close = angle === 'base';
    camera.position.set(close ? 5 : 0, close ? 1.25 : 2.7, close ? 83 : 101);
    camera.lookAt(0, close ? .85 : 3.15, 76);
  } else if (id === 'dinner') {
    camera.position.set(62, 1.65, -63.1);
    camera.lookAt(78, 2, -69);
  } else if (id === 'campus') {
    camera.position.set(0, 32, -170);
    camera.lookAt(0, 16, -70);
  } else {
    const distance = Math.max(b.width, b.height) * 1.22;
    const entryX = id === 'B05' ? 58 : b.x;
    const entryZ = b.z + b.depth / 2;
    const views = {
      front: [0, b.height * .40, distance],
      left: [-distance * .71, b.height * .43, distance * .71],
      right: [distance * .71, b.height * .43, distance * .71],
      entry: [entryX - b.x, 2.8, b.depth / 2 + 12],
      player: [entryX - b.x - 4, 1.65, b.depth / 2 + 7]
    };
    const [x, y, z] = views[angle];
    camera.position.set(b.x + x, y, b.z + z);
    if (angle === 'entry' || angle === 'player') camera.lookAt(entryX, 2.4, entryZ);
    else camera.lookAt(b.x, b.height * .47, b.z);
  }
  renderer.render(scene,camera);
  return { png: renderer.domElement.toDataURL(), ...renderer.info.render };
};
</script>
